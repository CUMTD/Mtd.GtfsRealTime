name: .NET Build

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
    PROJECT: Mtd.GtfsRealTime

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet-version: [10.0.x]
    permissions:
      contents: read
      packages: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}-${{ hashFiles('**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        env:
          MtdGithubUserName: CUMTD
          MtdGithubAccessToken: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore $PROJECT.slnx

      - name: Build
        run: dotnet build --no-restore --configuration Release $PROJECT.slnx

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Build-Artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: "**/Api/bin/Release/net*/**"
